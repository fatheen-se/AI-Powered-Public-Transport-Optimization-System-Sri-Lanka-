version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: transport_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  backend-api:
    build:
      context: ./apps/backend
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
    environment:
      - DB_HOST=db
      - DB_NAME=transport_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-securepassword123}
      - REDIS_HOST=redis
      - DJANGO_SETTINGS_MODULE=core.settings
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  backend-ws:
    build:
      context: ./apps/backend
    command: daphne -b 0.0.0.0 -p 8001 core.asgi:application
    environment:
      - DB_HOST=db
      - DB_NAME=transport_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-securepassword123}
      - REDIS_HOST=redis
      - DJANGO_SETTINGS_MODULE=core.settings
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.prod
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-api
      - backend-ws
      - frontend
    restart: always

volumes:
  postgres_data:
